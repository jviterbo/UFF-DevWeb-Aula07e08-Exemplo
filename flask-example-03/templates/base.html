<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Meus Recados{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
  <nav class="navbar navbar-expand navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="{{ url_for('index') }}">📋 Recados</a>
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link" href="{{ url_for('pendentes') }}">Pendentes</a></li>
        <li class="nav-item"><a class="nav-link" href="{{ url_for('categorias') }}">Categorias</a></li>
        <li class="nav-item"><a class="nav-link" href="{{ url_for('novo_recado') }}">Novo</a></li>
      </ul>
      <form class="d-flex" action="{{ url_for('busca') }}" method="get">
        <input class="form-control form-control-sm me-2" type="search" name="q" placeholder="Buscar recado">
        <button class="btn btn-outline-light btn-sm" type="submit">Buscar</button>
      </form>
    </div>
  </nav>

  <div class="container mt-4">
    {% with mensagens = get_flashed_messages(with_categories=true) %}
      {% for tipo, mensagem in mensagens %}
        <div class="alert alert-{{ tipo }} alert-dismissible fade show" role="alert">
          {{ mensagem }}
          <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fechar"></button>
        </div>
      {% endfor %}
    {% endwith %}

    {% block conteudo %}{% endblock %}
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
